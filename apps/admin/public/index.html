<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenTag</title>
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="identity">
        <strong>OpenTag</strong>
        <span id="capability-line">loading</span>
      </div>
      <div class="actions">
        <span class="status" id="health">offline</span>
        <button id="run">Run</button>
      </div>
    </header>

    <main class="workspace">
      <section class="compose-panel">
        <div class="panel-heading">
          <h1>Thread Console</h1>
          <span>workspace bot / scoped memory</span>
        </div>

        <label class="field">
          <span>Incoming message</span>
          <textarea id="prompt" spellcheck="false">@OpenTag 帮我看看这个 repo 怎么接飞书</textarea>
        </label>

        <div class="section-label">Clients</div>
        <div class="client-list" id="clients"></div>

        <div class="section-label">Memory</div>
        <div class="scope-list" id="memory-scopes"></div>
      </section>

      <section class="run-panel">
        <div class="panel-heading">
          <h2>Lark Preview</h2>
          <span id="route-line">no run</span>
        </div>

        <div id="card" class="lark-card empty">No run yet.</div>

        <div class="outbound-header">
          <span>Outbound</span>
          <span>thread reply</span>
        </div>
        <pre id="output">No message yet.</pre>

        <div class="section-label">Delivery</div>
        <div class="delivery-panel" id="delivery">loading</div>

        <div class="section-label">AgentDock parity</div>
        <div class="parity-list" id="parity"></div>
      </section>
    </main>

    <script type="module" src="/admin.js"></script>
  </body>
</html>
