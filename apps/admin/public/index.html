<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenTag</title>
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="identity">
        <strong>OpenTag</strong>
        <span id="capability-line">loading</span>
      </div>
      <div class="actions">
        <span class="status" id="health">offline</span>
        <button id="run">Run</button>
      </div>
    </header>

    <main class="workspace">
      <section class="compose-panel">
        <div class="panel-heading">
          <h1>Thread Console</h1>
          <span>workspace bot / scoped memory</span>
        </div>

        <label class="field">
          <span>Incoming message</span>
          <textarea id="prompt" spellcheck="false">@OpenTag 帮我看看这个 repo 怎么接飞书</textarea>
        </label>

        <div class="section-label">Clients</div>
        <div class="client-list" id="clients"></div>

        <div class="section-label">Memory</div>
        <div class="scope-list" id="memory-scopes"></div>
        <form class="memory-form" id="memory-form">
          <div class="memory-actions">
            <select id="memory-scope">
              <option value="project">project</option>
              <option value="workspace">workspace</option>
              <option value="global">global</option>
              <option value="thread">thread</option>
            </select>
            <button id="show-memory" type="button">Show</button>
            <button id="save-memory" type="submit">Save</button>
            <button id="forget-memory" type="button">Forget</button>
          </div>
          <label class="field compact">
            <span>Memory note</span>
            <textarea id="memory-text" spellcheck="false">OpenTag should keep Lark group memory separate by project.</textarea>
          </label>
        </form>
        <pre class="memory-output" id="memory-output">No memory loaded.</pre>

        <div class="section-label">Bindings</div>
        <form class="binding-form" id="binding-form">
          <label class="field compact">
            <span>Lark chat</span>
            <input id="binding-external-id" value="oc-smoke-project" spellcheck="false" />
          </label>
          <label class="field compact">
            <span>Workspace</span>
            <input id="binding-workspace-id" value="dev-workspace" spellcheck="false" />
          </label>
          <label class="field compact">
            <span>Project</span>
            <input id="binding-project-id" value="opentag" spellcheck="false" />
          </label>
          <div class="binding-actions">
            <select id="binding-activation-mode">
              <option value="mention">mention</option>
              <option value="always">always</option>
            </select>
            <label class="check-field">
              <input id="binding-require-mention" type="checkbox" checked />
              <span>mention</span>
            </label>
            <button id="save-binding" type="submit">Save</button>
          </div>
        </form>
        <div class="binding-list" id="bindings"></div>
      </section>

      <section class="run-panel">
        <div class="preview-column">
          <div class="panel-heading">
            <h2>Lark Preview</h2>
            <span id="route-line">no run</span>
          </div>

          <div id="card" class="lark-card empty">No run yet.</div>

          <div class="outbound-header">
            <span>Outbound</span>
            <span>thread reply</span>
          </div>
          <pre id="output">No message yet.</pre>
        </div>

        <aside class="status-column">
          <div class="section-label">Delivery</div>
          <div class="delivery-panel" id="delivery">loading</div>

          <div class="section-label">AgentDock parity</div>
          <div class="parity-list" id="parity"></div>
        </aside>
      </section>
    </main>

    <script type="module" src="/admin.js"></script>
  </body>
</html>
