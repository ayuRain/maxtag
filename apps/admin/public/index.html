<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenTag</title>
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <header class="shell-header">
      <div class="brand">
        <span class="mark">OpenTag</span>
        <span class="muted">thread agent runtime</span>
      </div>
      <div class="header-actions">
        <span class="status" id="health">offline</span>
        <button id="run">Run</button>
      </div>
    </header>

    <main class="shell">
      <section class="primary">
        <div class="section-head">
          <div>
            <h1>Thread Console</h1>
            <span id="capability-line">loading</span>
          </div>
        </div>

        <label class="field">
          <span>Message</span>
          <textarea id="prompt" spellcheck="false">@OpenTag 帮我看看这个 repo 怎么接飞书</textarea>
        </label>

        <div class="client-grid" id="clients">
          <article data-state="ready">
            <span>Lark</span>
            <strong>ready</strong>
          </article>
          <article data-state="planned">
            <span>Telegram</span>
            <strong>planned</strong>
          </article>
          <article data-state="planned">
            <span>Slack</span>
            <strong>planned</strong>
          </article>
          <article data-state="planned">
            <span>GitHub</span>
            <strong>planned</strong>
          </article>
        </div>
      </section>

      <section class="preview">
        <div class="section-head">
          <div>
            <h2>Lark Preview</h2>
            <span>progress card</span>
          </div>
        </div>
        <div id="card" class="card-preview empty">No run yet.</div>
      </section>

      <section class="output">
        <div class="section-head">
          <div>
            <h2>Outbound</h2>
            <span>thread reply</span>
          </div>
        </div>
        <pre id="output">No message yet.</pre>
      </section>
    </main>

    <script type="module" src="/admin.js"></script>
  </body>
</html>
