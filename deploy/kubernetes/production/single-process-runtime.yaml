apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: maxtag
spec:
  template:
    spec:
      # The control plane and Project runners currently share the RWO workspace
      # PVC. Keep them on one node until that volume is migrated to RWX.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: maxtag-project-runner
              topologyKey: kubernetes.io/hostname
      containers:
        - name: server
          resources:
            requests: {cpu: 1500m, memory: 3Gi}
            limits: {cpu: 4, memory: 8Gi}
        - name: worker
          $patch: delete
        - name: scheduler
          $patch: delete
