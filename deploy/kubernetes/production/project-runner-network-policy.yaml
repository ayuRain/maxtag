apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: maxtag-project-runner-isolation
  namespace: maxtag
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: maxtag-project-runner
      app.kubernetes.io/component: project-runner
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: maxtag
              app.kubernetes.io/component: control-plane
      ports:
        - protocol: TCP
          port: 3081
  # No direct egress. External access must be added later through a scoped
  # credential/egress broker instead of inheriting the control-plane network.
  egress: []
