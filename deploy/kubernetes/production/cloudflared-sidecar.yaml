apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: maxtag
spec:
  template:
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.1
          args: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cloudflared
              mountPath: /etc/cloudflared
              readOnly: true
      volumes:
        - name: cloudflared
          secret:
            secretName: maxtag-cloudflared
