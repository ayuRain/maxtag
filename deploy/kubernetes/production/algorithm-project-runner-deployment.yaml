apiVersion: apps/v1
kind: Deployment
metadata:
  name: maxtag-algorithm-project-runner
  namespace: maxtag
  labels:
    app.kubernetes.io/name: maxtag-algorithm-project-runner
    app.kubernetes.io/component: algorithm-project-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: maxtag-algorithm-project-runner
      app.kubernetes.io/component: algorithm-project-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maxtag-algorithm-project-runner
        app.kubernetes.io/component: algorithm-project-runner
    spec:
      imagePullSecrets:
        - name: maxtag-registry
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: maxtag
                  app.kubernetes.io/component: control-plane
              topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: project-runner
          image: maxtag:local
          args: ["project-runner"]
          env:
            - name: OPENTAG_PROJECT_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: maxtag-project-runner-auth
                  key: token
            - name: OPENTAG_PROJECT_RUNNER_COMMANDS
              value: "*"
            - name: OPENTAG_PROJECT_RUNNER_PORT
              value: "3081"
            - name: OPENTAG_PROJECT_RUNNER_MAX_TIMEOUT_MS
              value: "7200000"
            - name: OPENTAG_PROJECT_RUNNER_WORKSPACE_ROOT
              value: /srv/opentag/workspaces
            - name: OPENTAG_PROJECT_RUNNER_HOME_ROOT
              value: /tmp/opentag-project-runner
            - name: OPENTAG_PROJECT_RUNNER_BUILDKIT_HOST
              value: tcp://127.0.0.1:1234
            - name: OPENTAG_PROJECT_RUNNER_REGISTRY_CONFIG_FILE
              value: /var/run/secrets/maxtag-registry/config.json
            - name: OPENTAG_PROJECT_RUNNER_GIT_ASKPASS
              value: /app/deploy/kubernetes/github-askpass.sh
            - name: OPENTAG_PROJECT_RUNNER_MAXHANDSV2_RUNTIME_ENV_FILE
              value: /var/run/secrets/maxtag-build/maxhandsv2_runtime_env
            - name: OPENTAG_GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: maxtag-github-app
                  key: app-id
            - name: OPENTAG_GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: maxtag-github-app
                  key: installation-id
            - name: OPENTAG_GITHUB_APP_PRIVATE_KEY_FILE
              value: /var/run/secrets/maxtag-github-app/private-key.pem
            - name: OPENTAG_DATA_DIR
              value: /tmp/opentag-state
            - name: OPENTAG_ARTIFACT_ROOT
              value: /tmp/opentag-artifacts
            - name: OPENTAG_EXECUTOR_WORKSPACE_ROOT
              value: /srv/opentag/workspaces
          ports:
            - name: http
              containerPort: 3081
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: 4, memory: 8Gi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile: {type: RuntimeDefault}
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - name: persistent
              mountPath: /srv/opentag/workspaces
              subPath: workspaces
            - name: tmp
              mountPath: /tmp
            - name: github-app
              mountPath: /var/run/secrets/maxtag-github-app
              readOnly: true
            - name: registry
              mountPath: /var/run/secrets/maxtag-registry
              readOnly: true
            - name: build-secrets
              mountPath: /var/run/secrets/maxtag-build
              readOnly: true
        - name: buildkitd
          image: moby/buildkit:v0.23.2-rootless
          args:
            - --addr=tcp://0.0.0.0:1234
            - --oci-worker-no-process-sandbox
            - --oci-worker-gc=true
            - --oci-worker-gc-keepstorage=30000,20000,80000
          ports:
            - name: buildkit
              containerPort: 1234
          readinessProbe:
            tcpSocket: {port: buildkit}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: 2, memory: 4Gi}
            limits: {cpu: 8, memory: 32Gi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: {type: Unconfined}
            appArmorProfile: {type: Unconfined}
          volumeMounts:
            - name: buildkit-cache
              mountPath: /home/user/.local/share/buildkit
            - name: buildkit-tmp
              mountPath: /tmp
      volumes:
        - name: persistent
          persistentVolumeClaim:
            claimName: maxtag-state
        - name: tmp
          emptyDir: {sizeLimit: 8Gi}
        - name: buildkit-tmp
          emptyDir: {sizeLimit: 8Gi}
        - name: buildkit-cache
          persistentVolumeClaim:
            claimName: maxtag-algorithm-buildkit-cache
        - name: github-app
          secret:
            secretName: maxtag-github-app
            defaultMode: 256
        - name: registry
          secret:
            secretName: maxtag-registry
            items:
              - key: .dockerconfigjson
                path: config.json
            defaultMode: 256
        - name: build-secrets
          secret:
            secretName: maxtag-algorithm-build-secrets
            optional: true
            defaultMode: 256
