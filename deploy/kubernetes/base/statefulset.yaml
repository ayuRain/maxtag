apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: maxtag
  labels:
    app.kubernetes.io/name: maxtag
spec:
  serviceName: maxtag
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: maxtag
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maxtag
    spec:
      serviceAccountName: maxtag
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-state
          image: busybox:1.36.1
          command: ["sh", "-ec"]
          args:
            - mkdir -p /mnt/state /mnt/workspaces && chown 1000:1000 /mnt/state /mnt/workspaces
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: persistent
              mountPath: /mnt
      containers:
        - name: server
          image: maxtag:local
          args: ["server"]
          envFrom:
            - secretRef:
                name: maxtag-runtime-env
            - configMapRef:
                name: maxtag-runtime
          env:
            # The dedicated worker owns enrichment polling in this topology.
            # Disabling the duplicate server poll avoids needless cross-process
            # writes to the shared file-backed knowledge queue.
            - name: OPENTAG_KNOWLEDGE_ENRICHMENT_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 3077
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests: {cpu: 600m, memory: 1Gi}
            limits: {cpu: 1250m, memory: 1536Mi}
          securityContext: &restricted
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts: &state-mounts
            - name: persistent
              mountPath: /var/lib/opentag
              subPath: state
            - name: persistent
              mountPath: /srv/opentag/workspaces
              subPath: workspaces
            - name: tmp
              mountPath: /tmp
        - name: worker
          image: maxtag:local
          args: ["worker"]
          envFrom:
            - secretRef:
                name: maxtag-runtime-env
            - configMapRef:
                name: maxtag-runtime
          ports:
            - name: worker-metrics
              containerPort: 3078
          resources:
            requests: {cpu: 1, memory: 2Gi}
            limits: {cpu: 2, memory: 4Gi}
          securityContext: *restricted
          volumeMounts: *state-mounts
        - name: scheduler
          image: maxtag:local
          args: ["scheduler"]
          envFrom:
            - secretRef:
                name: maxtag-runtime-env
            - configMapRef:
                name: maxtag-runtime
          ports:
            - name: sched-metrics
              containerPort: 3079
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 250m, memory: 512Mi}
          securityContext: *restricted
          volumeMounts: *state-mounts
        - name: lark-bridge
          image: maxtag:local
          args: ["lark-bridge"]
          envFrom:
            - secretRef:
                name: maxtag-runtime-env
            - configMapRef:
                name: maxtag-runtime
          ports:
            - name: lark-metrics
              containerPort: 3080
          resources:
            requests: {cpu: 300m, memory: 768Mi}
            limits: {cpu: 500m, memory: 2Gi}
          securityContext: *restricted
          volumeMounts: *state-mounts
      volumes:
        - name: persistent
          persistentVolumeClaim:
            claimName: maxtag-state
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
