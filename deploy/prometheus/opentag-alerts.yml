groups:
  - name: opentag-runtime
    interval: 15s
    rules:
      - alert: OpenTagProcessDown
        expr: up{job="opentag"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MaxTag {{ $labels.component }} is unavailable"
          description: "Prometheus has failed to scrape {{ $labels.instance }} for one minute."

      - alert: OpenTagWorkerLoopStale
        expr: (time() - opentag_runtime_loop_last_run_timestamp_seconds{service="opentag-worker",loop="agent_worker"} > 60) and on(service, loop) (opentag_runtime_loop_running{service="opentag-worker",loop="agent_worker"} == 0)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MaxTag worker loop is stale"
          description: "The durable worker has not completed a pass for more than 60 seconds."

      - alert: OpenTagSchedulerLoopStale
        expr: time() - opentag_runtime_loop_last_run_timestamp_seconds{service="opentag-scheduler",loop="workflow_coordinator"} > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "MaxTag workflow scheduler loop is stale"
          description: "The workflow coordinator has not completed a pass for more than 30 seconds."

      - alert: OpenTagLarkBridgeEventKeyDown
        expr: opentag_lark_bridge_event_key_running{service="opentag-lark-bridge"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MaxTag Lark bridge consumer is down"
          description: "The {{ $labels.event_key }} long-connection consumer is not running."

      - alert: OpenTagLarkBridgeEventKeyNotReady
        expr: opentag_lark_bridge_event_key_ready{service="opentag-lark-bridge"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "MaxTag Lark bridge consumer is not ready"
          description: "The {{ $labels.event_key }} consumer has not reached the lark-cli ready marker."

      - alert: OpenTagLarkBridgeBackfillFailure
        expr: increase(opentag_lark_bridge_backfill_failed_total{service="opentag-lark-bridge"}[15m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "MaxTag Lark message recovery did not complete"
          description: "The bridge retained its prior checkpoint because startup backfill failed or reached its safety limit."

      - alert: OpenTagQueuedRunStale
        expr: opentag_agent_run_oldest_age_seconds{service="opentag-worker",status="queued"} > 300 and on(service) opentag_agent_runs{service="opentag-worker",status="queued"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MaxTag agent run has waited more than five minutes"
          description: "At least one durable run remains queued while the worker is expected to claim it."

      - alert: OpenTagRunLeaseStale
        expr: opentag_agent_run_oldest_age_seconds{service="opentag-worker",status="running"} > 60 and on(service) opentag_agent_runs{service="opentag-worker",status="running"} > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MaxTag running lease is stale"
          description: "A running agent lease has not received its expected heartbeat."

      - alert: OpenTagDelegatedAgentTaskQueued
        expr: opentag_delegated_agent_task_oldest_age_seconds{service="opentag-worker",status="queued"} > 300 and on(service) opentag_delegated_agent_tasks{service="opentag-worker",status="queued"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MaxTag delegated Agent task has waited more than five minutes"
          description: "At least one approved asynchronous Agent task remains queued while the worker is expected to claim it."

      - alert: OpenTagDelegatedAgentTaskClaimStale
        expr: opentag_delegated_agent_task_oldest_age_seconds{service="opentag-worker",status="claimed"} > 180 and on(service) opentag_delegated_agent_tasks{service="opentag-worker",status="claimed"} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "MaxTag delegated Agent task claim is stale"
          description: "An asynchronous Agent task has remained claimed past the normal execution lease."

      - alert: OpenTagKnowledgeSourceRefreshQueued
        expr: opentag_knowledge_source_refresh_oldest_age_seconds{service="opentag-worker",status="pending"} > 300 and on(service) opentag_knowledge_source_refresh_jobs{service="opentag-worker",status="pending"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MaxTag Knowledge Source refresh has waited more than five minutes"
          description: "At least one approved remote Source refresh remains pending while the worker is expected to claim it."

      - alert: OpenTagKnowledgeSourceRefreshClaimStale
        expr: opentag_knowledge_source_refresh_oldest_age_seconds{service="opentag-worker",status="claimed"} > 180 and on(service) opentag_knowledge_source_refresh_jobs{service="opentag-worker",status="claimed"} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "MaxTag Knowledge Source refresh claim is stale"
          description: "A remote Source refresh has remained claimed past the normal fetch lease."

      - alert: OpenTagOutboxStale
        expr: opentag_delivery_outbox_oldest_age_seconds{service="opentag-server",status=~"pending|sending"} > 120
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MaxTag outbound delivery is stuck"
          description: "The oldest {{ $labels.status }} outbox record is more than two minutes old."

      - alert: OpenTagRoutineClaimStale
        expr: opentag_routine_execution_oldest_age_seconds{service="opentag-scheduler",status="claimed"} > 120
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "MaxTag routine claim is stale"
          description: "A routine execution has remained claimed past the normal lease window."

      - alert: OpenTagWorkflowClaimStale
        expr: opentag_workflow_node_oldest_age_seconds{service="opentag-scheduler",status="claimed"} > 120
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "MaxTag workflow node claim is stale"
          description: "A workflow node has remained claimed past the normal lease window."
